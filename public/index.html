<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sun • Tide • UV • Moon (Australia)</title>
  <meta name="description" content="Australian sun times, UV, tide extremes and moon phase. Auto-detect location or use Brisbane." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="top">
        <div>
          <h1>Sun • Tide • UV • Moon</h1>
          <div class="muted" id="pillPlace">Location: —</div>
          <div class="muted" id="pillDate">Date: —</div>
        </div>
        <div class="pills">
          <span class="pill" id="pillStatus">Ready</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnLocate">Use my location</button>
        <button class="btn" id="btnBrisbane">Use Brisbane</button>
      </div>
    </div>

    <div class="gap"></div>

    <div class="grid2">
      <div class="card">
        <div class="label">UV (max today)</div>
        <div class="kpi" id="uvVal">—</div>
        <div class="muted" id="uvHint">—</div>
      </div>

      <div class="card">
        <div class="label">Moon</div>
        <div class="kpi" id="moonVal">—</div>
        <div class="muted" id="moonHint">—</div>
      </div>
    </div>

    <div class="gap"></div>

    <div class="grid2">
      <div class="card">
        <div class="label">Sun (Today)</div>
        <div class="kv">
          <div>Sunrise</div><div id="sunriseVal">—</div>
          <div>Sunset</div><div id="sunsetVal">—</div>
        </div>
      </div>

      <div class="card">
        <div class="label">Next tide</div>
        <div class="kpi" id="nextTide">—</div>
        <div class="muted" id="nextTideHint">—</div>
        <div class="muted" style="margin-top:8px" id="tideStation">Station: —</div>
      </div>
    </div>

    <div class="gap"></div>

    <div class="card">
      <div class="label">Tides (Today)</div>

      <div id="tidesEmpty" class="muted">No tide data yet.</div>
      <div id="tidesList" class="tides"></div>
    </div>

    <div class="gap"></div>

    <div class="card">
      <div class="label">Tomorrow</div>
      <div class="grid4">
        <div>
          <div class="muted">Sunrise</div>
          <div class="big" id="sunriseVal1">—</div>
        </div>
        <div>
          <div class="muted">Sunset</div>
          <div class="big" id="sunsetVal1">—</div>
        </div>
        <div>
          <div class="muted">UV</div>
          <div class="big" id="uvVal1">—</div>
        </div>
        <div>
          <div class="muted">Moon</div>
          <div class="big" id="moonVal1">—</div>
        </div>
      </div>
    </div>

    <div class="gap"></div>

    <div class="footer muted">
      Data: sunrise-sunset.org • Open-Meteo • Stormglass • Moon is calculated<br>
      © suntideuv
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
